name: desktop

# Builds the Tauri desktop shell (app/frontend/src-tauri) on macOS, Windows and Linux.
on:
  push:
    paths:
      - "app/frontend/src-tauri/**"
      - "app/frontend/package.json"
      - "app/frontend/package-lock.json"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "app/frontend/src-tauri/**"
      - "app/frontend/package.json"
      - "app/frontend/package-lock.json"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

jobs:
  tauri-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app,dmg
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/frontend/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Build desktop app
        working-directory: app/frontend
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: usb-llm-studio-${{ runner.os }}
          path: |
            app/frontend/src-tauri/target/release/bundle/
            app/frontend/src-tauri/target/release/usb-llm-studio.exe
          if-no-files-found: error
